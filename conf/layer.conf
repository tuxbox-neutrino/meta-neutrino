LAYERSERIES_COMPAT_neutrino = "kirkstone"

# We have a conf and classes directory, append to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a recipes directory containing .bb and .bbappend files, add to BBFILES
BBFILES := "${BBFILES} ${LAYERDIR}/recipes*/*/*.bb \
            ${BBFILES} ${LAYERDIR}/recipes*/*/*/*.bb \
            ${LAYERDIR}/recipes*/*/*.bbappend \
            ${LAYERDIR}/recipes*/*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "neutrino"
BBFILE_PATTERN_neutrino := "^${LAYERDIR}/"
BBFILE_PRIORITY_neutrino = "10"

# This layer's classes (neutrino-migit) inherit gitpkgv, which meta-tuxbox
# provides.  meta-openembedded ships a class of the same name with different
# semantics, so declare the dependency instead of relying on meta-tuxbox
# winning the BBPATH race.
LAYERDEPENDS_neutrino = "tuxbox"

# Additional license directories.
LICENSE_PATH += " \
	${LAYERDIR}/files/custom-licenses \
"

